<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Adrielly — um mundo só dela, pra Agatha." />
  <meta name="theme-color" content="#221420" />
  <title>Adrielly, pra Agatha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Dancing+Script:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/amigo.css" />

  <style>
    :root {
      --amigo-cor:       #c490b8;
      --amigo-cor-clara: #ddb8d0;
      --amigo-cor-fundo: #221420;
    }

    /* ================================================
       MURAL
       ================================================ */
    .mural-secao {
      background: #0f0815;
      padding: 5rem 1.5rem 6rem;
    }

    .mural-secao__cabecalho {
      text-align: center;
      margin-bottom: 4rem;
    }

    .mural-secao__olho {
      font-family: var(--fonte-sans);
      font-size: 0.72rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--amigo-cor-clara);
      opacity: 0.6;
      margin-bottom: 0.75rem;
    }

    .mural-secao__titulo {
      font-family: var(--fonte-serif);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-style: italic;
      font-weight: 300;
      color: var(--creme);
    }

    /* Container do mural — posicao relativa */
    .mural {
      position: relative;
      min-height: 880px;
      max-width: 820px;
      margin: 0 auto;
    }

    /* Polaroid base */
    .polaroid {
      position: absolute;
      background: #fdfcfa;
      padding: 10px 10px 44px;
      width: 210px;
      box-shadow: 3px 6px 24px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.25);
      z-index: 1;
      transition: box-shadow 0.3s ease, z-index 0s;
    }

    .polaroid:hover {
      box-shadow: 8px 16px 44px rgba(0,0,0,0.7);
      z-index: 10;
    }

    .polaroid img {
      width: 100%;
      display: block;
      filter: brightness(0.96) contrast(1.02) saturate(0.93);
    }

    .polaroid .caption {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: #3a3a3a;
      text-align: center;
      padding-top: 10px;
      line-height: 1.2;
    }

    /* Posicoes e rotacoes de cada polaroid */
    .polaroid:nth-child(1) { left:  2%;  top:  30px; transform: rotate(-5deg);   }
    .polaroid:nth-child(2) { left: 36%;  top:  10px; transform: rotate(3.5deg);  }
    .polaroid:nth-child(3) { left: 63%;  top:  50px; transform: rotate(-6deg);   }
    .polaroid:nth-child(4) { left:  9%;  top: 305px; transform: rotate(7deg);    }
    .polaroid:nth-child(5) { left: 44%;  top: 275px; transform: rotate(-4deg);   }
    .polaroid:nth-child(6) { left: 27%;  top: 545px; transform: rotate(2.5deg);  }

    /* Mobile: grid simples */
    @media (max-width: 640px) {
      .mural {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        min-height: auto;
        justify-content: center;
        padding-bottom: 1rem;
      }
      .polaroid {
        position: static;
        width: 44%;
      }
      .polaroid:nth-child(1) { transform: rotate(-3deg); }
      .polaroid:nth-child(2) { transform: rotate(3deg);  }
      .polaroid:nth-child(3) { transform: rotate(-2deg); }
      .polaroid:nth-child(4) { transform: rotate(2.5deg);}
      .polaroid:nth-child(5) { transform: rotate(-3deg); }
      .polaroid:nth-child(6) { transform: rotate(1.5deg);}
    }
  </style>
</head>

<body class="amigo" data-amigo="adrielly">

  <!-- HERO -->
  <section class="amigo-hero">
    <div class="amigo-hero__conteudo">
      <p class="amigo-hero__para">Para você, de:</p>
      <h1 class="amigo-hero__nome">Adrielly</h1>
      <p class="amigo-hero__subtitulo">
        Juntei esses momentos porque cada um deles me lembra o quanto te amo.
      </p>
    </div>
    <div class="amigo-hero__seta" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z" fill="currentColor"/>
      </svg>
    </div>
  </section>

  <!-- MURAL -->
  <section class="mural-secao">
    <header class="amigo-secao__cabecalho mural-secao__cabecalho">
      <p class="mural-secao__olho">mural</p>
      <h2 class="mural-secao__titulo">momentos que ficam</h2>
    </header>

    <div class="mural">
      <div class="polaroid">
        <img src="../../assets/mural/a.jpg" alt="" />
        <p class="caption">pra sempre</p>
      </div>
      <div class="polaroid">
        <img src="../../assets/mural/aa.jpg" alt="" />
        <p class="caption">te amo demais</p>
      </div>
      <div class="polaroid">
        <img src="../../assets/mural/aaa.jpg" alt="" />
        <p class="caption">momentos assim</p>
      </div>
      <div class="polaroid">
        <img src="../../assets/mural/aaaa.jpg" alt="" />
        <p class="caption">minha cúmplice</p>
      </div>
      <div class="polaroid">
        <img src="../../assets/mural/aaaaa.jpg" alt="" />
        <p class="caption">só nós duas</p>
      </div>
      <div class="polaroid">
        <img src="../../assets/mural/aaaaaa.jpg" alt="" />
        <p class="caption">sempre juntas</p>
      </div>
    </div>
  </section>

  <script src="../../js/amigo.js" defer></script>
</body>
</html>
